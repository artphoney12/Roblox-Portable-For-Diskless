<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran Berhasil - Roblox Portable</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'></circle><path d='M8 12l3 3 5-5'></path></svg>">
  <style>
    body {
      background-color: #111827;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    .container {
      background: #1f2937;
      border: 1px solid #374151;
      padding: 40px;
      border-radius: 16px;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .icon {
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 24px auto;
      font-size: 40px;
      border: 2px solid #10b981;
    }
    h2 {
      margin: 0 0 16px 0;
      font-size: 24px;
      color: #f9fafb;
    }
    p {
      color: #9ca3af;
      line-height: 1.6;
      margin-bottom: 24px;
      font-size: 15px;
    }
    .highlight {
      color: #10b981;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="icon">✓</div>
    <h2 id="title">Terima Kasih Banyak!</h2>
    <p id="message">Kami telah menerima konfirmasi pembayaran Anda. <br><br>Lisensi Anda <span class="highlight">sedang diproses secara otomatis</span> oleh sistem kami. Silakan kembali ke aplikasi <strong>Roblox Portable</strong> Anda, notifikasi konfirmasi akan segera muncul di sana.</p>
  </div>

  <script>
    const cName = localStorage.getItem('cName');
    const wName = localStorage.getItem('wName');
    
    if (cName || wName) {
        let nameText = cName ? cName : "Kak";
        document.getElementById('title').innerText = `Terima Kasih Banyak, ${nameText}!`;
        
        let msgText = `Kami telah menerima konfirmasi pembayaran Anda.`;
        if (wName) {
            msgText = `Kami telah menerima konfirmasi pembayaran dari <strong>${wName}</strong>.`;
        }
        
        msgText += `<br><br>Lisensi Anda <span class="highlight">sedang diproses secara otomatis</span> oleh sistem kami. Silakan kembali ke aplikasi <strong>Roblox Portable</strong> Anda, notifikasi konfirmasi akan segera muncul di sana.`;
        
        document.getElementById('message').innerHTML = msgText;
    }
    
    localStorage.removeItem('cName');
    localStorage.removeItem('wName');
  </script>
</body>
</html>
